<template>
    <div class="ds-shell">
        <div class="ds-hero">
            <div class="ds-hero-brand">
                <img class="ds-hero-logo" src={logoUrl} alt="Pravadh DocSign"/>
                <div>
                <div class="ds-eyebrow">Pravadh DocSign</div>
                <h1 class="ds-title">Any Object. Any Document. Any Signature.</h1>
                <p class="ds-sub">Generate. Sign. Store. Automate. Document generation &amp; eSignature, built natively for Salesforce.</p>
                </div>
            </div>
            <div class="ds-hero-actions">
                <lightning-button label="Templates" icon-name="utility:page" data-tab="DocSign_Templates" onclick={goTab}></lightning-button>
                <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" onclick={load} class="slds-m-left_x-small"></lightning-button-icon>
            </div>
        </div>

        <template if:true={loading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>
        <template if:true={error}><div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{error}</div></template>

        <template if:true={data}>
            <div class="ds-metrics">
                <template for:each={metrics} for:item="m">
                    <div key={m.key} class={m.cls}>
                        <lightning-icon icon-name={m.icon} size="small" class="ds-metric-icon"></lightning-icon>
                        <div class="ds-metric-value">{m.value}</div>
                        <div class="ds-metric-label">{m.label}</div>
                    </div>
                </template>
            </div>

            <template if:true={hasDrafts}>
                <div class="ds-card ds-drafts">
                    <div class="ds-card-head">
                        <h2>Continue where you left off</h2>
                        <span class="ds-muted">PDFs you started preparing</span>
                    </div>
                    <ul class="ds-draft-list">
                        <template for:each={drafts} for:item="r">
                            <li key={r.id} class="ds-draft-row">
                                <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                                <div class="ds-draft-main">
                                    <div class="ds-draft-title slds-truncate" title={r.title}>{r.title}</div>
                                    <div class="ds-muted">{r.detail} · {r.when}</div>
                                </div>
                                <template if:true={r.sourceRecordId}>
                                    <lightning-button variant="base" label="Open record" data-id={r.sourceRecordId} onclick={openSource}></lightning-button>
                                </template>
                                <lightning-button variant="brand" label="Continue" icon-name="utility:edit" data-id={r.id} onclick={continueDraft}></lightning-button>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

            <div class="ds-grid">
                <div class="ds-card">
                    <div class="ds-card-head">
                        <h2>Recent envelopes</h2>
                        <lightning-button variant="base" label="View all" data-tab="DocSign_Envelope__c" onclick={goTab}></lightning-button>
                    </div>
                    <template if:true={hasRecent}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered ds-table">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">Envelope</th>
                                    <th scope="col">Document</th>
                                    <th scope="col">Source</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Updated</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={recent} for:item="r">
                                    <tr key={r.id} class="ds-row" data-id={r.id} onclick={openEnvelope}>
                                        <td><a>{r.name}</a></td>
                                        <td class="slds-truncate" title={r.title}>{r.title}</td>
                                        <td><a data-id={r.sourceRecordId} onclick={openSource}>{r.sourceObject}</a></td>
                                        <td><c-doc-sign-status-badge status={r.status}></c-doc-sign-status-badge></td>
                                        <td>{r.when}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template if:false={hasRecent}>
                        <div class="ds-empty">
                            <lightning-icon icon-name="utility:signature" size="medium"></lightning-icon>
                            <p>No envelopes yet. Add the <b>Pravadh DocSign</b> component to any record page, pick a template and click Generate.</p>
                        </div>
                    </template>
                </div>

                <div class="ds-card">
                    <div class="ds-card-head">
                        <h2>Get started</h2>
                        <span class="ds-muted">{setupProgress}% complete</span>
                    </div>
                    <div class="ds-progress"><div class="ds-progress-bar" style={progressStyle}></div></div>
                    <ul class="ds-steps">
                        <template for:each={setup} for:item="s">
                            <li key={s.key} class={s.cls}>
                                <lightning-icon icon-name={s.icon} size="x-small"></lightning-icon>
                                <div>
                                    <div class="ds-step-label">{s.label}</div>
                                    <div class="ds-muted">{s.help}</div>
                                </div>
                            </li>
                        </template>
                    </ul>
                    <div class="ds-pillars">
                        <div><b>Generate</b><span>From any standard or custom object</span></div>
                        <div><b>Sign</b><span>Multi-signer, sequential or parallel</span></div>
                        <div><b>Automate</b><span>Flow actions &amp; platform events</span></div>
                        <div><b>Store</b><span>Salesforce Files + audit trail</span></div>
                    </div>
                </div>
            </div>
            <div class="ds-about-wrap"><c-doc-sign-about></c-doc-sign-about></div>
        </template>
        <c-doc-sign-promo></c-doc-sign-promo>
        <c-doc-sign-tips context="home" variant="floating"></c-doc-sign-tips>
        <template if:true={prep}>
            <c-doc-sign-pdf-prep document-id={prep.documentId} prep-url={prep.prepUrl} onclose={closePrep} onprepared={handlePrepared}></c-doc-sign-pdf-prep>
        </template>
    </div>
</template>
