<div class="app">
  <div class="workspace">
    <aside class="side left" aria-label="Insert">
      <div class="ptabs" role="tablist">
        <button type="button" class="ptab" role="tab" data-panel="fields" aria-selected="true">Fields</button>
        <button type="button" class="ptab" role="tab" data-panel="blocks" aria-selected="false">Blocks</button>
        <button type="button" class="ptab" role="tab" data-panel="signers" aria-selected="false">Signers</button>
      </div>
      <div class="ppanel" id="panel-fields">
        <div class="objbar"><span>Object <b id="objName">Loading</b></span></div>
        <div class="crumbs" id="crumbs"></div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <label class="sr-only" for="fieldSearch">Search fields</label>
          <input id="fieldSearch" placeholder="Search fields" autocomplete="off"/>
        </div>
        <p class="panel-intro">Click to insert at the cursor, or drag onto the page. Arrows open parent records and related lists.</p>
        <div id="fieldList"></div>
      </div>
      <div class="ppanel" id="panel-blocks" hidden="hidden">
        <p class="panel-intro">Click to insert. In the document, type <kbd>/</kbd> for the same list.</p>
        <div id="blockList" style="display:grid;gap:8px"></div>
      </div>
      <div class="ppanel" id="panel-signers" hidden="hidden">
        <p class="panel-intro">Signers sign in this order. Click a field type to place it for that signer.</p>
        <div id="signerList" style="display:grid;gap:10px"></div>
      </div>
    </aside>
    <main class="center">
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
        <button type="button" class="tb" data-cmd="undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
        <button type="button" class="tb" data-cmd="redo" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
        <span class="sep"></span>
        <label class="sr-only" for="styleSel">Text style</label>
        <select id="styleSel" class="style-sel"><option value="p">Body text</option><option value="1">Heading 1</option><option value="2">Heading 2</option><option value="3">Heading 3</option></select>
        <span class="sep"></span>
        <button type="button" class="tb" data-cmd="bold" aria-label="Bold" aria-pressed="false"><span class="glyph" style="font-weight:700">B</span></button>
        <button type="button" class="tb" data-cmd="italic" aria-label="Italic" aria-pressed="false"><span class="glyph" style="font-style:italic">I</span></button>
        <button type="button" class="tb" data-cmd="underline" aria-label="Underline" aria-pressed="false"><span class="glyph" style="text-decoration:underline">U</span></button>
        <span class="sep"></span>
        <button type="button" class="tb" data-cmd="left" aria-label="Align left" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h14"></path></svg></button>
        <button type="button" class="tb" data-cmd="center" aria-label="Align centre" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M5 18h14"></path></svg></button>
        <button type="button" class="tb" data-cmd="right" aria-label="Align right" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M10 12h10M6 18h14"></path></svg></button>
        <span class="sep"></span>
        <button type="button" class="tb" data-cmd="bullet" aria-label="Bulleted list" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r="1" fill="currentColor"></circle><circle cx="4.5" cy="12" r="1" fill="currentColor"></circle><circle cx="4.5" cy="18" r="1" fill="currentColor"></circle></svg></button>
        <button type="button" class="tb" data-cmd="ordered" aria-label="Numbered list" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M4 5h1.5v4M4 9h3M4 14.5c0-1 2.8-1.2 2.8.2 0 1-2.8 1.8-2.8 3.3h3" stroke-width="1.5"></path></svg></button>
        <button type="button" class="tb" data-cmd="table" aria-label="Insert table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"></rect><path d="M3.5 10h17M3.5 15h17M10 4.5v15"></path></svg></button>
        <button type="button" class="tb" data-cmd="break" aria-label="Insert page break"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v5h12V3M6 21v-5h12v5"></path><path d="M3 12h3M9 12h2M13 12h2M18 12h3"></path></svg></button>
        <span class="tb-hint">Type <kbd>/</kbd> for blocks</span>
      </div>
      <div class="desk">
        <div class="paper"><div id="editor"></div></div>
      </div>
    </main>
    <aside class="side right" id="inspector" aria-label="Properties"></aside>
  </div>
</div>
<div id="slash" class="slash" role="listbox" aria-label="Insert block" hidden="hidden"></div>
<div id="toast" class="toast" role="status" hidden="hidden"></div>
